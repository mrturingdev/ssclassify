<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- S.S. Classify — Variant 4: Quadrant Prism -->
  <!-- A squircle aperture partitioned by an S-channel into 4 category taxonomy quadrants -->
  <!-- Outer squircle chassis -->
  <rect x="22" y="22" width="56" height="56" rx="14" 
        stroke="currentColor" stroke-width="3"/>
  
  <!-- Central S-shaped classifying divider -->
  <path d="M 50 22 C 50 34 36 38 36 50 C 36 62 50 66 50 78" 
        stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        
  <!-- Horizontal partition lines with rounded gaps -->
  <line x1="22" y1="50" x2="32" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="68" y1="50" x2="78" y2="50" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>

  <!-- Taxonomy category quadrant markers -->
  <circle cx="36" cy="35" r="3" fill="currentColor"/>
  <circle cx="64" cy="35" r="2" fill="currentColor" opacity="0.6"/>
  <circle cx="64" cy="65" r="3" fill="currentColor"/>
  <circle cx="36" cy="65" r="2" fill="currentColor" opacity="0.6"/>
</svg>
