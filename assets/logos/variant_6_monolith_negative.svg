<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- S.S. Classify — Variant 6: The Monolith Shutter -->
  <!-- A solid capture slate carved with rounded negative-space S-apertures -->
  <defs>
    <mask id="monolith-cutout">
      <!-- White background reveals solid mass -->
      <rect width="100" height="100" fill="white"/>
      <!-- Black paths carve out rounded negative space -->
      <!-- Top S aperture -->
      <path d="M 64 34 C 64 30 58 28 50 28 C 40 28 36 32 36 38 C 36 45 64 47 64 58 C 64 68 54 72 44 72 C 34 72 32 66 32 66" 
            stroke="black" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Optical focal puncture -->
      <circle cx="62" cy="34" r="3" fill="black"/>
      <circle cx="34" cy="66" r="3" fill="black"/>
    </mask>
  </defs>
  
  <!-- Solid squircle tile masked by the negative space curves -->
  <rect x="18" y="18" width="64" height="64" rx="18" 
        fill="currentColor" mask="url(#monolith-cutout)"/>
</svg>
