org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
# Keep the app (and its scan) installed after :classyBenchmark runs, so later runs skip the scan.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Lint from AGP 9.4.1 (Lint 32.4.1): AGP 8.9's bundled Lint reads Kotlin metadata only
# up to 2.1, so on Kotlin 2.4 its Kotlin analysis degraded with "expected version is 2.1.0".
# Drop this when AGP itself is upgraded.
android.experimental.lint.version=9.4.1
