<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.S. Classify — Logo Design Exploration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #FAFAFA;
            color: #1A1A1A;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        body.dark-mode {
            background: #0A0A0A;
            color: #F0F0F0;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }
        .logo-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 20px;
            padding: 28px 24px;
            border: 1px solid transparent;
        }
        .logo-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.06);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.06);
        }
        .dark-mode .logo-card:hover {
            background: rgba(20, 20, 20, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.6);
        }
        .logo-aura {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(0,102,204,0.12) 0%, transparent 70%);
            border-radius: 50%;
            transform: scale(0.6);
            opacity: 0;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(30px);
            pointer-events: none;
        }
        .logo-card:hover .logo-aura {
            transform: scale(1.1);
            opacity: 1;
        }
        .divider-line {
            width: 0;
            height: 1px;
            background: currentColor;
            opacity: 0.2;
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-card:hover .divider-line { width: 100%; }
        .tracking-ultra-wide { letter-spacing: 0.22em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Variant 1: Optical S-Loop
        const Logo1 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="w-full h-full text-current">
                <path d="M 50 50 C 38 38 34 29 38 23 C 42 17 50 17 56 21 C 62 25 66 33 50 50 C 34 67 38 75 44 79 C 50 83 58 83 62 77 C 66 71 62 62 50 50 Z" 
                      stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"/>
                <circle cx="50" cy="50" r="3.5" fill="currentColor"/>
                <circle cx="70" cy="24" r="2" fill="currentColor" opacity="0.4"/>
                <circle cx="30" cy="76" r="2" fill="currentColor" opacity="0.4"/>
            </svg>
        );

        // Variant 2: Dual Screen S-Flow
        const Logo2 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="w-full h-full text-current">
                <rect x="36" y="16" width="38" height="54" rx="7" 
                      stroke="currentColor" strokeWidth="2.5" strokeDasharray="4 3" opacity="0.45"/>
                <rect x="26" y="30" width="38" height="54" rx="7" 
                      stroke="currentColor" strokeWidth="3" fill="transparent"/>
                <path d="M 54 26 C 46 26 42 30 42 36 C 42 43 58 45 58 53 C 58 60 52 64 44 64" 
                      stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <line x1="33" y1="40" x2="41" y2="40" stroke="currentColor" strokeWidth="2" strokeLinecap="round" opacity="0.6"/>
                <circle cx="56" cy="74" r="2.5" fill="currentColor"/>
            </svg>
        );

        // Variant 3: Viewfinder Twin-S
        const Logo3 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="w-full h-full text-current">
                <path d="M 23 33 V 25 C 23 23 25 21 27 21 H 35" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M 65 21 H 73 C 75 21 77 23 77 25 V 33" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M 77 67 V 75 C 77 77 75 79 73 79 H 65" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M 35 79 H 27 C 25 79 23 77 23 75 V 67" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/>
                <path d="M 44 34 C 37 34 33 37.5 33 42 C 33 47.5 41 49 45 51 C 49 53 51 55.5 51 59 C 51 64 46.5 67 40 67 C 34.5 67 31 63.5 30 60" 
                      stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
                <path d="M 62 33 C 67.5 33 71 36.5 71 41 C 71 45.5 67 48 61 50 C 56 51.5 52 53.5 52 58 C 52 62.5 56.5 66 63 66 C 68 66 72 63 73 59" 
                      stroke="currentColor" strokeWidth="3.5" strokeLinecap="round"/>
            </svg>
        );

        // Variant 4: Quadrant Prism
        const Logo4 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="w-full h-full text-current">
                <rect x="22" y="22" width="56" height="56" rx="14" stroke="currentColor" strokeWidth="3"/>
                <path d="M 50 22 C 50 34 36 38 36 50 C 36 62 50 66 50 78" 
                      stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                <line x1="22" y1="50" x2="32" y2="50" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                <line x1="68" y1="50" x2="78" y2="50" stroke="currentColor" strokeWidth="3" strokeLinecap="round"/>
                <circle cx="36" cy="35" r="3" fill="currentColor"/>
                <circle cx="64" cy="35" r="2" fill="currentColor" opacity="0.6"/>
                <circle cx="64" cy="65" r="3" fill="currentColor"/>
                <circle cx="36" cy="65" r="2" fill="currentColor" opacity="0.6"/>
            </svg>
        );

        // Variant 5: The OCR Matrix
        const Logo5 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="w-full h-full text-current">
                <g fill="currentColor" opacity="0.18">
                    <circle cx="26" cy="26" r="1.8"/> <circle cx="38" cy="26" r="1.8"/> <circle cx="50" cy="26" r="1.8"/> <circle cx="62" cy="26" r="1.8"/> <circle cx="74" cy="26" r="1.8"/>
                    <circle cx="26" cy="38" r="1.8"/> <circle cx="38" cy="38" r="1.8"/> <circle cx="50" cy="38" r="1.8"/> <circle cx="62" cy="38" r="1.8"/> <circle cx="74" cy="38" r="1.8"/>
                    <circle cx="26" cy="50" r="1.8"/> <circle cx="38" cy="50" r="1.8"/> <circle cx="50" cy="50" r="1.8"/> <circle cx="62" cy="50" r="1.8"/> <circle cx="74" cy="50" r="1.8"/>
                    <circle cx="26" cy="62" r="1.8"/> <circle cx="38" cy="62" r="1.8"/> <circle cx="50" cy="62" r="1.8"/> <circle cx="62" cy="62" r="1.8"/> <circle cx="74" cy="62" r="1.8"/>
                    <circle cx="26" cy="74" r="1.8"/> <circle cx="38" cy="74" r="1.8"/> <circle cx="50" cy="74" r="1.8"/> <circle cx="62" cy="74" r="1.8"/> <circle cx="74" cy="74" r="1.8"/>
                </g>
                <g fill="currentColor">
                    <rect x="34" y="24" width="16" height="4" rx="2"/>
                    <circle cx="26" cy="38" r="3"/>
                    <rect x="24" y="48" width="16" height="4" rx="2"/>
                    <circle cx="38" cy="62" r="3"/>
                    <rect x="24" y="72" width="16" height="4" rx="2"/>
                    <rect x="58" y="24" width="16" height="4" rx="2"/>
                    <circle cx="62" cy="38" r="3"/>
                    <rect x="60" y="48" width="16" height="4" rx="2"/>
                    <circle cx="74" cy="62" r="3"/>
                    <rect x="60" y="72" width="16" height="4" rx="2"/>
                </g>
            </svg>
        );

        // Variant 6: The Monolith Shutter
        const Logo6 = () => (
            <svg viewBox="0 0 100 100" fill="none" className="w-full h-full text-current">
                <defs>
                    <mask id="preview-mask">
                        <rect width="100" height="100" fill="white"/>
                        <path d="M 64 34 C 64 30 58 28 50 28 C 40 28 36 32 36 38 C 36 45 64 47 64 58 C 64 68 54 72 44 72 C 34 72 32 66 32 66" 
                              stroke="black" strokeWidth="7" strokeLinecap="round" fill="none"/>
                        <circle cx="62" cy="34" r="3" fill="black"/>
                        <circle cx="34" cy="66" r="3" fill="black"/>
                    </mask>
                </defs>
                <rect x="18" y="18" width="64" height="64" rx="18" fill="currentColor" mask="url(#preview-mask)"/>
            </svg>
        );

        const logos = [
            {
                id: 1,
                title: "The Optical S-Loop",
                subtitle: "Pattern 1.2 • Infinite Ribbon",
                file: "variant_1_infinity_loop.svg",
                Component: Logo1,
                philosophy: "A single continuous fluid path forming a double-S ribbon around a central OCR focal node. Symbolizes perpetual, instantaneous screenshot intake and smart categorization with pure elegance.",
                badge: "Recommended"
            },
            {
                id: 2,
                title: "Dual Screen S-Flow",
                subtitle: "Pattern 2.4 • Layered Screenshots",
                file: "variant_2_dual_frames.svg",
                Component: Logo2,
                philosophy: "Two offset device screenshot capture cards united by an energetic classification S-spine. Visually communicates mobile screenshot scanning, sorting from raw screen into structured knowledge.",
                badge: "Mobile Native"
            },
            {
                id: 3,
                title: "Viewfinder Twin-S",
                subtitle: "Pattern 3.1 • Capture Aperture",
                file: "variant_3_viewfinder_s.svg",
                Component: Logo3,
                philosophy: "High-precision screenshot viewfinder brackets enclosing an interlocking dual-S monogram. Grounded in camera capture hardware semantics with over 50% generous negative space.",
                badge: "Iconic"
            },
            {
                id: 4,
                title: "Quadrant Prism",
                subtitle: "Pattern 2.3 • Geometry + Taxonomy",
                file: "variant_4_quadrant_prism.svg",
                Component: Logo4,
                philosophy: "A rounded squircle partition lens slicing space into four distinct category quadrants (Receipts, Chats, Work, Media). Celebrates structure, taxonomy, and multi-class organization.",
                badge: "Taxonomy"
            },
            {
                id: 5,
                title: "The OCR Matrix",
                subtitle: "Pattern 1.1 • Dot Sensor System",
                file: "variant_5_ocr_matrix.svg",
                Component: Logo5,
                philosophy: "A subtle optical dot sensor matrix where active nodes resolve from raw pixels into semantic S-classification streams. Deeply rooted in machine learning and OCR text parsing.",
                badge: "AI / Tech"
            },
            {
                id: 6,
                title: "The Monolith Shutter",
                subtitle: "Principle 8 • Negative Space Slate",
                file: "variant_6_monolith_negative.svg",
                Component: Logo6,
                philosophy: "An architectural solid squircle capture tile carved by rounded negative-space S-apertures. Creates immediate brand recognition at 16x16 favicon as well as 512x512 app launcher size.",
                badge: "App Launcher Ready"
            }
        ];

        const LogoShowcase = () => {
            const [darkMode, setDarkMode] = useState(false);
            const [selectedId, setSelectedId] = useState(1);
            const [copiedId, setCopiedId] = useState(null);

            const toggleDarkMode = () => {
                setDarkMode(!darkMode);
                document.body.classList.toggle('dark-mode');
            };

            const copyFileName = (id, file) => {
                navigator.clipboard.writeText(file);
                setCopiedId(id);
                setTimeout(() => setCopiedId(null), 2000);
            };

            return (
                <div className="min-h-screen flex flex-col items-center py-16 px-6">
                    {/* Top Mode Switcher */}
                    <div className="w-full max-w-7xl flex justify-between items-center mb-12">
                        <div className="flex items-center space-x-3">
                            <span className="font-mono text-xs uppercase tracking-widest opacity-60">Brand Exploration</span>
                            <span className="text-xs px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-600 font-medium font-mono">op7418 Skill Spec</span>
                        </div>
                        <button 
                            onClick={toggleDarkMode}
                            className="font-mono text-xs px-4 py-2 rounded-full border border-current opacity-70 hover:opacity-100 transition-opacity">
                            {darkMode ? "☀️ Light Mode" : "🌙 Dark Mode"}
                        </button>
                    </div>

                    {/* Header */}
                    <div className="text-center mb-20 max-w-3xl">
                        <h1 className="text-5xl md:text-7xl font-extralight tracking-tight mb-4">
                            S.S. Classify
                        </h1>
                        <p className="font-mono text-xs opacity-50 uppercase tracking-ultra-wide mb-6">
                            On-Device Intelligent Screenshot Classification
                        </p>
                        <div className="w-12 h-[1px] bg-current mx-auto opacity-30"></div>
                    </div>

                    {/* Logo Grid */}
                    <div className="max-w-7xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 mb-24">
                        {logos.map((logo) => {
                            const isSelected = selectedId === logo.id;
                            return (
                                <div 
                                    key={logo.id} 
                                    onClick={() => setSelectedId(logo.id)}
                                    className={`flex flex-col items-center logo-card cursor-pointer relative ${
                                        isSelected ? 'ring-2 ring-blue-500/50 bg-white/80 dark:bg-white/5' : ''
                                    }`}>
                                    
                                    {/* Badge */}
                                    <div className="absolute top-4 right-4 font-mono text-[10px] tracking-wider px-2 py-0.5 rounded bg-black/5 dark:bg-white/10 opacity-75">
                                        {logo.badge}
                                    </div>

                                    {/* Logo Canvas */}
                                    <div className="w-56 h-56 mb-6 flex items-center justify-center relative">
                                        <div className="logo-aura"></div>
                                        <div className="w-32 h-32 relative z-10 transition-transform duration-500 hover:scale-110">
                                            <logo.Component />
                                        </div>
                                    </div>

                                    {/* Text Info */}
                                    <div className="text-center w-full px-2">
                                        <h2 className="text-lg font-medium tracking-wide mb-1">
                                            {logo.title}
                                        </h2>
                                        <h3 className="text-[11px] font-mono opacity-50 tracking-wider mb-4">
                                            {logo.subtitle}
                                        </h3>
                                        <p className="text-xs leading-relaxed opacity-75 text-left font-light mb-6 min-h-[56px]">
                                            {logo.philosophy}
                                        </p>
                                    </div>

                                    {/* Actions */}
                                    <div className="w-full flex items-center justify-between pt-4 border-t border-current/10">
                                        <span className="font-mono text-[11px] opacity-40">assets/logos/{logo.file}</span>
                                        <button 
                                            onClick={(e) => { e.stopPropagation(); copyFileName(logo.id, logo.file); }}
                                            className="font-mono text-[11px] text-blue-500 hover:underline">
                                            {copiedId === logo.id ? "Copied!" : "Select"}
                                        </button>
                                    </div>

                                    <div className="divider-line mt-4 mx-auto"></div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Selected Hero Showcase Preview */}
                    <div className="max-w-4xl w-full p-8 rounded-3xl bg-black/5 dark:bg-white/5 border border-current/10 text-center mb-24">
                        <div className="font-mono text-xs uppercase tracking-widest opacity-50 mb-3">Live App Icon & Splash Preview</div>
                        <div className="text-2xl font-light mb-8">
                            Selected Direction: <span className="font-semibold">{logos.find(l => l.id === selectedId)?.title}</span>
                        </div>
                        <div className="flex flex-wrap items-center justify-center gap-10">
                            {/* App Launcher Squircle */}
                            <div className="flex flex-col items-center">
                                <div className="w-24 h-24 rounded-[22px] bg-gradient-to-br from-neutral-900 to-black text-white p-5 shadow-2xl flex items-center justify-center">
                                    {React.createElement(logos.find(l => l.id === selectedId)?.Component)}
                                </div>
                                <span className="font-mono text-[11px] opacity-60 mt-3">iOS / Android Icon</span>
                            </div>

                            {/* Light Surface Button / Header */}
                            <div className="flex flex-col items-center">
                                <div className="w-24 h-24 rounded-[22px] bg-white text-neutral-900 border border-neutral-200 p-5 shadow-sm flex items-center justify-center">
                                    {React.createElement(logos.find(l => l.id === selectedId)?.Component)}
                                </div>
                                <span className="font-mono text-[11px] opacity-60 mt-3">Light Surface Icon</span>
                            </div>

                            {/* Small 32x32 Favicon / Notification */}
                            <div className="flex flex-col items-center">
                                <div className="w-10 h-10 rounded-lg bg-neutral-950 text-white p-2 flex items-center justify-center">
                                    {React.createElement(logos.find(l => l.id === selectedId)?.Component)}
                                </div>
                                <span className="font-mono text-[11px] opacity-60 mt-3">Notification / Favicon</span>
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="max-w-2xl text-center">
                        <p className="font-mono text-xs opacity-40 uppercase tracking-ultra-wide leading-loose">
                            Generated with op7418/logo-generator-skill<br/>
                            S.S. Classify • 2026
                        </p>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<LogoShowcase />, document.getElementById('root'));
    </script>
</body>
</html>
